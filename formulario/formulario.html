<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="form.css">
    <link href="https://api.fontshare.com/v2/css?f[]=array@400,701&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../imagenes/favi-form.gif" type="image/x-icon">
</head>
<body>

    <main class="contenedor-central">
        
        <div class="barra-titulo-ventana">
            <span class="texto-titulo">Opinion_Usuario.exe</span>
            <div class="botones-ventana">
                <button type="button" id="btn-modo-oscuro-form" class="btn-mini-win" style="width: auto; padding: 0 5px; font-size: 11px;">Modo Oscuro</button>
                <button class="btn-mini-win">-</button>
                <button class="btn-mini-win">■</button>
                <button class="btn-mini-win">X</button>
            </div>
        </div>

        <div class="cuerpo-ventana">
            
            <nav class="contenedor-regreso">
                <a href="../principal/guia.html" class="enlace-volver">꧁ Volver a la guía ꧂</a>
            </nav>

            <article>
                <h1>¡Compartinos lo que pensás!</h1>
            </article>

            <form action="#">
                <fieldset class="grupo-formulario">
                    <legend>Datos personales</legend>
                    
                    <div class="campo-formulario">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingrese nombre" class="entrada-texto" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ingrese apellido" class="entrada-texto">
                    </div>

                    <div class="campo-formulario">
                        <label for="celular">Celular:</label>
                        <input type="tel" id="celular" name="celular" pattern="[0-9]+" title="Solo números" placeholder="Ingrese número de celular" class="entrada-texto" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Ingrese email" class="entrada-texto" required>
                    </div>
                </fieldset>

                <fieldset class="grupo-formulario">
                    <legend>Preferencias</legend>
                    
                    <span class="pregunta-formulario">¿Te gustó la página?</span> 
                    
                    <div class="opcion-seleccion"><input type="radio" name="valoracion" id="v1" value="si"> <label for="v1">Si</label></div>
                    <div class="opcion-seleccion"><input type="radio" name="valoracion" id="v2" value="no"> <label for="v2">No</label></div>
                    <div class="opcion-seleccion"><input type="radio" name="valoracion" id="v3" value="mejorar"> <label for="v3">Puede mejorar</label></div>
                    <div class="opcion-seleccion"><input type="radio" name="valoracion" id="v4" value="encanto"> <label for="v4">Me encantó</label></div>
                    
                    <hr class="linea-separadora">
                    
                    <span class="pregunta-formulario">¿Qué parte te gustó más?</span> 
                    
                    <div class="opcion-seleccion"><input type="checkbox" name="gusto" id="p1" value="publicidad"> <label for="p1">La publicidad</label></div>
                    <div class="opcion-seleccion"><input type="checkbox" name="gusto" id="p2" value="tips"> <label for="p2">Los tips</label></div>
                    <div class="opcion-seleccion"><input type="checkbox" name="gusto" id="p3" value="apps"> <label for="p3">Las aplicaciones</label></div>
                    <div class="opcion-seleccion"><input type="checkbox" name="gusto" id="p4" value="recom"> <label for="p4">Las recomendaciones</label></div>
                    <div class="opcion-seleccion"><input type="checkbox" name="gusto" id="p5" value="consejos"> <label for="p5">Los consejos para estudiar</label></div>
                </fieldset>

                <fieldset class="grupo-formulario">
                    <legend>Opiniones</legend>
                    
                    <div class="campo-formulario">
                        <textarea name="comentarios" id="comentarios" rows="7" cols="40" maxlength="171" placeholder="Escriba aquí sus consejos o sugerencias..." class="area-comentario"></textarea> 
                    </div>

                    <div id="mensaje-alerta" class="alerta-retro" style="display: none;"></div>

                    <div class="contenedor-botones-form" >
                        <input type="submit" value="Enviar" class="btn-formulario">
                        <input type="reset" value="Limpiar" class="btn-formulario">
                    </div>

                    <hr class="linea-separadora">
                    <h3 class="agradecimiento">Gracias por sumar tu experiencia a esta guía de supervivencia. ¡Éxitos con el estudio! — 🎧ྀི</h3>
                </fieldset>
            </form>

            <footer class="pie-ventana">
                <p><b>Hecho por Furrer Agostina - 2026</b></p>
            </footer>
        </div>
    </main>
    <script src="form.js" defer></script>
</body>
</html>
